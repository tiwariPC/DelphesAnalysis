# Object selection. Delphes has no ID/isolation working points (Loose ID/Iso, DeepTau):
# the CMS Delphes card already applies its efficiencies and isolation to the Electron,
# Muon and Photon collections, and taus are jets carrying Delphes' TauTag.
muons:
  pt_min: 10.0
  eta_max: 2.4

electrons:
  pt_min: 10.0
  eta_max: 2.5

photons:
  pt_min: 15.0
  eta_max: 2.5

taus:
  pt_min: 20.0
  eta_max: 2.3

jets:
  pt_min: 30.0
  eta_max: 2.5
  # Remove jets within this Delta R of a selected electron, muon or photon
  clean_dr: 0.4

bjets:
  btag_threshold: 1

regions:
  "1b:SR":
    description: "Signal region, 1 b-tag category"
    cuts:
      Nbjets: "==1"
      NjetsMin: "1"
      Njets: "<=2"
      Nleptons: "==0"
      Ntaus: "==0"
      Nphotons: "==0"
      MET: ">250"
      Jet1Pt: ">100"
      dphi_jet_met_min: ">0.5"

  "2b:SR":
    description: "Signal region, 2 b-tag category"
    cuts:
      Nbjets: "==2"
      NjetsMin: "2"
      Njets: "<=3"
      Nleptons: "==0"
      Ntaus: "==0"
      Nphotons: "==0"
      MET: ">250"
      Jet1Pt: ">100"
      dphi_jet_met_min: ">0.5"
